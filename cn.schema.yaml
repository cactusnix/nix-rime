# Rime schema
# encoding: utf-8

schema:
  name: 小鹤双拼
  schema_id: cn
  author:
    - cactusnix
  description:
    - Simple And Pure
  version: "0.1"

switches:
  - name: ascii_mode
    reset: 0
    states: [中, 英]

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - xform/[iu]a$/X/
    - xform/ian$/M/
    - xform/[iu]ang$/L/
    - xform/iao$/N/
    - xform/ing$|uai$/K/
    - xform/i?ong$/S/
    - xform/uan$/R/
    - xform/uo$/O/
    - xform/(.)ang$/$1H/
    - xform/(.)eng$/$1G/
    - xform/(.)an$/$1J/
    - xform/(.)en$/$1F/
    - xform/(.)in$/$1B/
    - xform/(.)un$/$1Y/
    - xform/(.)ai$/$1D/
    - xform/(.)ei$/$1W/
    - xform/(.)ui$/$1V/
    - xform/(.)ao$/$1C/
    - xform/(.)ou$/$1Z/
    - xform/(.)iu$/$1Q/
    - xform/(.)ie$/$1P/
    - xform/(.)[uv]e$/$1T/
    - xform/^ch/I/
    - xform/^sh/U/
    - xform/^zh/V/
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/

translator:
  dictionary: cn

punctuator:
  import_preset: default
